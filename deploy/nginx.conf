# Proxy inverso con TLS (certbot). La API sirve también la web Angular compilada.
server {
    listen 80;
    server_name padel.ejemplo.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name padel.ejemplo.com;
    ssl_certificate     /etc/letsencrypt/live/padel.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padel.ejemplo.com/privkey.pem;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
