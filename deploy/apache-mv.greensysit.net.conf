# /etc/apache2/sites-available/mv.greensysit.net.conf
# Web Angular estática en /var/www/html/fmp y API (uvicorn en 127.0.0.1:8000) detrás de /api.
# Módulos necesarios: a2enmod proxy proxy_http rewrite headers ssl
<VirtualHost *:80>
    ServerName mv.greensysit.net
    DocumentRoot /var/www/html/fmp

    <Directory /var/www/html/fmp>
        Options -Indexes
        AllowOverride None
        Require all granted
        # SPA: cualquier ruta que no sea un fichero real carga index.html
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule ^ index.html [L]
    </Directory>

    # Ficheros con hash en el nombre: caché larga. index.html: sin caché.
    <FilesMatch "\.(js|css|woff2|png|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog ${APACHE_LOG_DIR}/mv-error.log
    CustomLog ${APACHE_LOG_DIR}/mv-access.log combined
</VirtualHost>
# TLS: tras activar el sitio, "certbot --apache -d mv.greensysit.net" crea el VirtualHost :443 y la redirección.
