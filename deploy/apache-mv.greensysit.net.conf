# /etc/apache2/sites-available/mv.greensysit.net.conf
# Web Angular estática en /var/www/html/fmp y API (uvicorn en 127.0.0.1:8000) en el mismo origen bajo /api.
# Módulos: a2enmod proxy proxy_http headers ssl
<Directory /var/www/html/fmp>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    # Rutas de Angular (SPA): si el fichero no existe, sirve index.html.
    FallbackResource /index.html
</Directory>

<VirtualHost *:80>
    ServerName mv.greensysit.net
    Redirect permanent / https://mv.greensysit.net/
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName mv.greensysit.net
    DocumentRoot /var/www/html/fmp

    # Anula el Alias /icons/ global de Debian (mods-enabled/alias.conf)
    Alias /icons/ /var/www/html/fmp/icons/
    <Directory /var/www/html/fmp/icons>
        Options -Indexes
        Require all granted
        FallbackResource disabled
    </Directory>

    # --- API en el mismo origen: /api -> uvicorn en :8000 ---
    ProxyPreserveHost On
    ProxyPass        /api  http://127.0.0.1:8000/api
    ProxyPassReverse /api  http://127.0.0.1:8000/api
    ProxyPass        /     !

    # Ficheros con hash en el nombre: caché larga. index.html: siempre fresco.
    <FilesMatch "\.(js|css|woff2|png|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog ${APACHE_LOG_DIR}/mv-error.log
    CustomLog ${APACHE_LOG_DIR}/mv-access.log combined

    SSLEngine on
    SSLCertificateFile      /root/certificado/certificate.crt
    SSLCertificateKeyFile   /root/certificado/certificate.key
    SSLCertificateChainFile /root/certificado/certificate.ca.crt
</VirtualHost>
